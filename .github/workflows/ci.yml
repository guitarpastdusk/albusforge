name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # web's typecheck (`next typegen`) and build (`next build`) both write
      # apps/web/.next. apps/web/turbo.json orders them in the task graph —
      # typecheck depends on build — and the two steps keep a race from coming
      # back through the command line. Step two is a turbo cache hit.
      - name: Typecheck, lint, test
        run: pnpm turbo run typecheck lint test

      - name: Build
        run: pnpm turbo run build

  docker:
    # The image deploy-web.yml ships, built on every PR so a broken Dockerfile
    # fails here instead of on the first push to main. Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: web:ci
          provenance: false
          sbom: false

      # Mock mode is allowed here because K_SERVICE is unset; on Cloud Run the
      # startup guard refuses it.
      - name: Smoke-test the container
        run: |
          docker run -d --name web -p 8080:8080 -e API_MODE=mock web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          for path in / /projects /live /live/bed-c /marketplace; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            echo "${path} ${code}"
            [ "$code" = 200 ] || { docker logs web; exit 1; }
          done

      - name: Container logs
        if: failure()
        run: docker logs web || true
