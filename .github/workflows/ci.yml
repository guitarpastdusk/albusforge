name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # web's typecheck (`next typegen`) and build (`next build`) both write
      # apps/web/.next. apps/web/turbo.json orders them in the task graph —
      # typecheck depends on build — and the two steps keep a race from coming
      # back through the command line. Step two is a turbo cache hit.
      - name: Typecheck, lint, test
        run: pnpm turbo run typecheck lint test

      - name: Build
        run: pnpm turbo run build
