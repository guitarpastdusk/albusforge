name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # web's typecheck (`next typegen`) and build (`next build`) both write
      # apps/web/.next. apps/web/turbo.json orders them in the task graph —
      # typecheck depends on build — and the two steps keep a race from coming
      # back through the command line. Step two is a turbo cache hit.
      - name: Typecheck, lint, test
        run: pnpm turbo run typecheck lint test

      - name: Build
        run: pnpm turbo run build

  docker:
    # The image deploy-web.yml ships, built on every PR so a broken Dockerfile
    # fails here instead of on the first push to main. Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: web:ci
          provenance: false
          sbom: false

      # Mock mode is allowed here because K_SERVICE is unset; on Cloud Run the
      # startup guard refuses it.
      - name: Smoke-test the container
        run: |
          docker run -d --name web -p 8080:8080 -e API_MODE=mock web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          # Public pages render for a signed-out visitor.
          for path in / /about /marketplace /signin /signup; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            echo "${path} ${code}"
            [ "$code" = 200 ] || { docker logs web; exit 1; }
          done
          # Public assets ship in the image (standalone output leaves out public/).
          for path in /enclosure/fixture.glb /enclosure/fixture.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            echo "${path} ${code}"
            [ "$code" = 200 ] || { docker logs web; exit 1; }
          done
          # Signed-in pages redirect a signed-out visitor to sign-in, keeping the destination.
          for path in /projects /live /live/bed-c; do
            read -r code location < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "http://localhost:8080${path}")
            echo "${path} ${code} -> ${location}"
            [ "$code" = 307 ] || { docker logs web; exit 1; }
            case "$location" in
              */signin\?next=*) ;;
              *) echo "expected a redirect to /signin?next=, got '${location}'"; docker logs web; exit 1 ;;
            esac
          done
          # With a session (mock-issued cookie: "mock-session." + base64url(email)), they render.
          session="mock-session.$(printf '%s' smoke@example.com | base64 | tr '+/' '-_' | tr -d '=')"
          for path in /projects /live /live/bed-c; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: __Host-albus_session=${session}" "http://localhost:8080${path}")
            echo "${path} (signed in) ${code}"
            [ "$code" = 200 ] || { docker logs web; exit 1; }
          done

      - name: Container logs
        if: failure()
        run: docker logs web || true

  docker-gateway:
    # The two images deploy-gateway.yml ships, built on every PR and run the way
    # the deploy runs them: db-migrate, registry-load (twice, the second a
    # no-op), then gateway against the loaded database. Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The superuser stands in for albus_migrate, as in docker-compose.yml.
          POSTGRES_USER: albus_migrate
          POSTGRES_PASSWORD: migrate-secret
          POSTGRES_DB: albus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albus_migrate -d albus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB: -e DB_HOST=127.0.0.1 -e DB_NAME=albus -e DB_SSL=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: gateway:ci
          provenance: false
          sbom: false

      - name: Build db-jobs image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/db-jobs.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: db-jobs:ci
          provenance: false
          sbom: false

      # With no database at all: liveness is 200, readiness 503, and the
      # fallbacks answer JSON.
      - name: Smoke-test gateway without a database
        run: |
          docker run -d --name gateway-nodb -p 8081:8080 \
            -e DB_HOST=127.0.0.1 -e DB_PORT=1 -e DB_NAME=none -e DB_USER=none -e DB_PASSWORD=none -e DB_SSL=disable \
            gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8081/healthz; then break; fi
            sleep 1
          done
          check() { # check PATH STATUS
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://localhost:8081$1")
            type=$(curl -s -o /dev/null -w '%{content_type}' "http://localhost:8081$1")
            echo "$1 $code $type $(head -c 200 /tmp/body)"
            [ "$code" = "$2" ] && [[ "$type" == application/json* ]] || { docker logs gateway-nodb; exit 1; }
          }
          check /healthz 200
          check /readyz 503
          check /v1/builds 501
          check /nope 404

      # CLOUD_RUN_JOB selects the task, as on Cloud Run, where the jobs set no
      # command or args. --network host reaches the service container.
      - name: Run db-migrate, then registry-load twice
        run: |
          set -o pipefail
          docker run --rm --network host ${DB} -e CLOUD_RUN_JOB=db-migrate \
            -e DB_USER=albus_migrate -e DB_PASSWORD=migrate-secret \
            -e DB_APP_ROLE=albus_app -e DB_APP_PASSWORD=app-secret \
            db-jobs:ci
          for run in 1 2; do
            docker run --rm --network host ${DB} -e CLOUD_RUN_JOB=registry-load \
              -e DB_USER=albus_app -e DB_PASSWORD=app-secret \
              db-jobs:ci | tee "/tmp/load-${run}.log"
          done
          grep -q '"inserted":\["C-001@' /tmp/load-1.log
          grep -q '"inserted":\[\],"unchanged":\["C-001@' /tmp/load-2.log

      - name: Smoke-test gateway against the loaded database
        run: |
          docker run -d --name gateway --network host ${DB} -e PORT=8080 \
            -e DB_USER=albus_app -e DB_PASSWORD=app-secret \
            gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/readyz
          count=$(curl -fsS http://localhost:8080/v1/parts | jq '.parts | length')
          echo "parts: ${count}"
          [ "$count" = 12 ] || { docker logs gateway; exit 1; }
          curl -fsS http://localhost:8080/v1/parts/C-001 | jq -e '.part.id == "C-001"'

      - name: Container logs
        if: failure()
        run: |
          docker logs gateway-nodb || true
          docker logs gateway || true

  deploy-scripts:
    # The deploy workflows' freshness and promotion checks, against a stub
    # gcloud and a throwaway git history. No cloud access.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Test deploy scripts
        run: bash .github/scripts/test/run.sh
